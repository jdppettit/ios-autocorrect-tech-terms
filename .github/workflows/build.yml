name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate term lists
        run: python3 scripts/build.py --check
      - name: Build plists
        run: python3 scripts/build.py
      - name: Ensure dist/ is up to date
        if: github.event_name != 'release'
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date. Run 'python3 scripts/build.py' and commit the result."
            exit 1
          fi
      - name: Attach plists to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tech-terms.plist dist/categories/*.plist --clobber
